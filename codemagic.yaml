workflows:
  ios-testflight:
    name: Where I'm Watching - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      groups:
        - where_im_watching
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.czielerworks.whereimwatching
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
          include: true

    scripts:
      - name: Install JavaScript dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      - name: Sync the Capacitor iOS project
        script: npx cap sync ios

      - name: Apply App Store signing profiles
        script: xcode-project use-profiles

      - name: Set the iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build the signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
